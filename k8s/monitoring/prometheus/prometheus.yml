# Настройки Prometheus: что и как часто собирать.
global:
  # Для учебного стенда собираем часто, чтобы графики и тесты быстро видели результат.
  # В реальной работе обычно 15-30 секунд.
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # Сам Prometheus.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Поды API. Адреса подов не прописаны вручную: Prometheus спрашивает у Kubernetes, какие поды сейчас
  # есть в namespace library (kubernetes_sd), поэтому новые поды после обновления находятся сами.
  - job_name: api
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [library]
    relabel_configs:
      # берём только поды API и только порт http
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: api
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: http
        action: keep
      # имя пода как метка pod: видно, какой из экземпляров дал значение
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
