# ConfigMap: несекретные настройки отдельно от образов. Меняем значение, не пересобирая образ.
# Пароли здесь НЕ хранятся: они в Secret library-db (его создаёт deploy.sh, в git его нет).
apiVersion: v1
kind: ConfigMap
metadata:
  name: library-config
  namespace: library
data:
  POSTGRES_USER: library
  POSTGRES_DB: library
  # Фронтенд (nginx) проксирует /api сюда: имя Service api внутри кластера.
  API_UPSTREAM: http://api:8000
