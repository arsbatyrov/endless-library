# ConfigMap: несекретные настройки отдельно от образов. Меняем значение, не пересобирая образ.
# Пароли здесь НЕ хранятся: они в Secret endless-library-db (его создаёт deploy.sh, в git его нет).
apiVersion: v1
kind: ConfigMap
metadata:
  name: endless-library-config
  namespace: endless-library
data:
  POSTGRES_USER: library
  POSTGRES_DB: library
  # Фронтенд (nginx) проксирует /api сюда: имя Service api внутри кластера.
  API_UPSTREAM: http://api:8000
  # Кэш. Если Redis недоступен, API продолжает работать без кэша (readiness от Redis НЕ зависит).
  REDIS_URL: redis://redis:6379/0
