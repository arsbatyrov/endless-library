[pytest]
testpaths = tests
# По умолчанию UI-тесты (ui), дымовые тесты кластера (smoke) и контрактные тесты (contract) не запускаются: они медленнее и требуют Node и браузер. Запуск: pytest -m ui
# Для UI-тестов при падении сохраняются трассировка, видео и скриншот (папка test-results/artifacts).
addopts = --cov=app --cov-branch --cov-report=term-missing -m "not ui and not smoke and not contract" --tracing=retain-on-failure --video=retain-on-failure --screenshot=only-on-failure --output=test-results/artifacts
markers =
    db: тест использует PostgreSQL (ставится автоматически). Без базы: pytest -m "not db"
    redis: тест использует Redis (ставится автоматически). Без Redis: pytest -m "not redis"
    ui: UI-тест в браузере (Playwright), ставится автоматически тестам из tests/ui. Запуск: pytest -m ui --no-cov
    smoke: дымовые тесты развёрнутого стенда в кластере (ставится автоматически тестам из tests/smoke). Запуск: pytest tests/smoke -m smoke --no-cov
    anonymous: UI-тест начинается БЕЗ входа (по умолчанию UI-тесты стартуют уже вошедшими админом). tests/ui/test_login.py
    contract: контрактные тесты по OpenAPI (Schemathesis, снимок схемы), ставится автоматически тестам из tests/contract. Запуск: pytest tests/contract -m contract --no-cov
