[pytest]
testpaths = tests
# По умолчанию UI-тесты (маркер ui) не запускаются: они медленнее и требуют Node и браузер. Запуск: pytest -m ui
# Для UI-тестов при падении сохраняются трассировка, видео и скриншот (папка test-results/artifacts).
addopts = --cov=app --cov-branch --cov-report=term-missing -m "not ui" --tracing=retain-on-failure --video=retain-on-failure --screenshot=only-on-failure --output=test-results/artifacts
markers =
    db: тест использует PostgreSQL (ставится автоматически). Без базы: pytest -m "not db"
    ui: UI-тест в браузере (Playwright), ставится автоматически тестам из tests/ui. Запуск: pytest -m ui --no-cov
