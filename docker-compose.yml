name: endless-library

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 127.0.0.1: база доступна только с этого компьютера, а не из локальной сети
      - "127.0.0.1:5432:5432"
    volumes:
      # Именованный том: данные переживают удаление и пересоздание контейнера
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Кэш и счётчики популярности. Данные не сохраняются на диск (--save "" --appendonly no): это кэш,
  # потерять его не страшно, всё восстановится из Postgres. maxmemory + allkeys-lru: при нехватке памяти
  # Redis сам выбрасывает давно не используемые записи.
  redis:
    image: redis:8.10-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- Приложение целиком в контейнерах. Запуск: docker compose --profile full up -d --build ----
  # Профиль full: обычная команда `docker compose up -d db` по-прежнему поднимает только базу.

  # Разовая задача: накатывает миграции и завершается.
  migrate:
    profiles: ["full"]
    build: .
    image: endless-library-api:local
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["full"]
    build: .
    image: endless-library-api:local
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      # снаружи API виден под /api (nginx отрезает префикс): нужно для страницы документации
      API_ROOT_PATH: /api
      # Required by the API (it refuses to start without a strong secret). An empty default here lets
      # `docker compose up -d db redis` work without it; the API then stops with a clear message.
      JWT_SECRET: ${JWT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Наружу не публикуется: доступен только фронтенду по внутренней сети (имя api, порт 8000).
    restart: unless-stopped

  web:
    profiles: ["full"]
    build: ./frontend
    image: endless-library-web:local
    environment:
      API_UPSTREAM: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Адрес приложения: http://127.0.0.1:8081 (интерфейс), /api/... проксируется в API
      - "127.0.0.1:8081:80"
    restart: unless-stopped

volumes:
  pgdata:
    # Имя тома закреплено: проект Compose переименован, а в этом томе лежат рабочая база и тестовые базы.
    # Без закрепления Compose создал бы новый пустой том endless-library_pgdata.
    name: library_pgdata
