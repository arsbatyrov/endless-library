name: Feature (requirement)
description: A new capability or a behaviour change, with acceptance criteria, Definition of Ready and Definition of Done
title: "[REQ-ID] Short title"
labels: ["feature", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## How to use this template
        Fill in the fields below. Tick the **Definition of Ready (DoR)** items before moving the ticket to the
        *Ready* column: until they are done, the ticket stays in *Backlog*. Tick the **Definition of Done (DoD)**
        items while you work: the ticket is closed (`Fixes #number` in the PR) only when every item is done.

        The repository is public: do not put tokens, passwords or personal data into the ticket.

  - type: input
    id: requirement_id
    attributes:
      label: Requirement ID
      description: From the requirements document. It is also used in the title and in test markers.
      placeholder: LOAN-001
    validations:
      required: true

  - type: textarea
    id: story
    attributes:
      label: Description (user story)
      description: Who wants what, and why.
      placeholder: |
        As a librarian, I want to issue a book to a reader,
        so that copies and return dates are tracked automatically.
    validations:
      required: true

  - type: dropdown
    id: areas
    attributes:
      label: Area (platforms)
      description: What the ticket affects. After creating it, set the same value in the Area field on the project board and add the area:* labels.
      multiple: true
      options:
        - api
        - web
        - android
        - infra
        - ci
        - docs
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: "How urgent the business value is. After creating the ticket, add the same priority:* label and set the Priority field on the board. The scale is the same as for bugs (see docs/agent-team/process/bug-triage.md)."
      options:
        - Critical
        - High
        - Mid
        - Low
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria (Given / When / Then)
      description: Verifiable conditions of completion. Tests are written from them and the result is accepted against them.
      placeholder: |
        1. Given: the reader has fewer than 3 books and a copy is available
           When: the librarian issues the book
           Then: a loan is created, the due date is +14 days, and the available copies decrease by 1
        2. Given: the reader already has 3 books
           When: the librarian issues one more
           Then: the loan is rejected with an error and the available copies do not change
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What is deliberately NOT included (so the ticket does not grow).
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and links
      description: Related tickets (#number), documents, mock-ups, API contract changes.
    validations:
      required: false

  - type: checkboxes
    id: test_levels
    attributes:
      label: Test levels
      description: Where the ticket must be covered by automated tests (tick the plan, not the result).
      options:
        - label: Unit
        - label: API
        - label: Contract (OpenAPI, Schemathesis)
        - label: UI web (Playwright)
        - label: Mobile (Appium)
        - label: Smoke on the cluster
        - label: Manual and exploratory testing

  - type: checkboxes
    id: dor
    attributes:
      label: Definition of Ready (ready to be taken into work)
      description: Tick an item when it is done. When all items are done, the ticket can move to Ready.
      options:
        - label: The value is clear and the user story is written (who, what, why)
        - label: Acceptance criteria are written as Given/When/Then and are verifiable
        - label: The ticket is small (up to 1-2 days); if it is bigger, it is split into subtasks
        - label: Platforms and dependencies are listed, and there are no blocking questions
        - label: Test levels and the required test data are defined
        - label: If the API changes, the contract (OpenAPI) change is described and agreed
        - label: If there is a user interface, the Russian and English texts and the states (loading, empty, error) are defined
        - label: Priority is set (the Priority field and the priority:* label) and the ticket is on the board

  - type: checkboxes
    id: dod
    attributes:
      label: Definition of Done
      description: Tick items as you work. The ticket is closed when all items are done.
      options:
        - label: The code is implemented, reviewed, and linked to the PR (Fixes #number)
        - label: All acceptance criteria are met and verified
        - label: Automated tests are added at the planned levels and linked to the requirement ID
        - label: All required CI checks are green (lint, tests, contract, UI, Docker, Kubernetes smoke)
        - label: If the API changed, the OpenAPI snapshot is updated deliberately and backward compatibility is checked
        - label: Interface texts are translated (ru and en); loading, empty and error states are checked
        - label: No secrets or personal data in code, logs or test data; errors and edge cases are handled
        - label: Logs and metrics are added where needed; the dashboard or alert is updated if necessary
        - label: Documentation is updated (README, requirements, examples)
        - label: Verified on the deployed environment (cluster), no regressions found
        - label: Defects found along the way are filed as bugs (bug) with a priority
