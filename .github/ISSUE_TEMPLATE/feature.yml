name: Feature (требование)
description: Новая возможность или изменение поведения с критериями приёмки, Definition of Ready и Definition of Done
title: "[REQ-ID] Краткое название"
labels: ["feature", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Как пользоваться шаблоном
        Заполните поля ниже. **Definition of Ready (DoR)** отмечайте до того, как переносить задачу в колонку *Ready*:
        пока пункты не выполнены, задача остаётся в *Backlog*. **Definition of Done (DoD)** отмечайте в процессе
        работы: задача закрывается (`Fixes #номер` в PR) только когда выполнены все пункты.

        Репозиторий публичный: не пишите в задаче токены, пароли и персональные данные.

  - type: input
    id: requirement_id
    attributes:
      label: Идентификатор требования
      description: Из документа с требованиями. Он же указывается в заголовке и в маркерах тестов.
      placeholder: LOAN-001
    validations:
      required: true

  - type: textarea
    id: story
    attributes:
      label: Описание (User story)
      description: Кто, что хочет и зачем.
      placeholder: |
        Как библиотекарь, я хочу выдать книгу читателю,
        чтобы учёт экземпляров и сроков возврата велся автоматически.
    validations:
      required: true

  - type: dropdown
    id: areas
    attributes:
      label: Область (платформы)
      description: Что затрагивает задача. После создания выставьте то же в поле Area на доске проекта и поставьте метки area:*.
      multiple: true
      options:
        - api
        - web
        - android
        - infra
        - ci
        - docs
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Критерии приёмки (Given / When / Then)
      description: Проверяемые условия готовности. По ним пишутся тесты и принимается результат.
      placeholder: |
        1. Дано: у читателя меньше 3 книг и есть свободный экземпляр
           Когда: библиотекарь выдаёт книгу
           Тогда: выдача создана, срок возврата +14 дней, остаток уменьшился на 1
        2. Дано: у читателя уже 3 книги
           Когда: библиотекарь выдаёт ещё одну
           Тогда: выдача отклонена с ошибкой, остаток не изменился
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Вне рамок задачи
      description: Что намеренно НЕ входит (чтобы не растягивать задачу).
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Зависимости и ссылки
      description: Связанные задачи (#номер), документы, макеты, изменения контракта API.
    validations:
      required: false

  - type: checkboxes
    id: test_levels
    attributes:
      label: Уровни тестирования
      description: Где задача должна быть покрыта автотестами (отметьте план, а не факт).
      options:
        - label: Unit
        - label: API
        - label: Контракт (OpenAPI, Schemathesis)
        - label: UI web (Playwright)
        - label: Mobile (Appium)
        - label: Smoke на кластере
        - label: Ручное и исследовательское тестирование

  - type: checkboxes
    id: dor
    attributes:
      label: Definition of Ready (готово к взятию в работу)
      description: Отметьте, когда пункт выполнен. Все пункты закрыты, значит можно переносить в Ready.
      options:
        - label: Ценность понятна, user story сформулирована (кто, что, зачем)
        - label: Критерии приёмки записаны в формате Given/When/Then и проверяемы
        - label: Задача небольшая (до 1–2 дней); если больше, разбита на подзадачи
        - label: Указаны платформы и зависимости, блокирующих вопросов нет
        - label: Определены уровни тестирования и нужные тестовые данные
        - label: Если меняется API, изменение контракта (OpenAPI) описано и согласовано
        - label: Если есть интерфейс, определены тексты на русском и английском и состояния (загрузка, пусто, ошибка)
        - label: Определена серьёзность и приоритет (метки sev:*, P1–P3), задача добавлена на доску

  - type: checkboxes
    id: dod
    attributes:
      label: Definition of Done (готово)
      description: Отмечайте в процессе работы. Задача закрывается, когда выполнены все пункты.
      options:
        - label: Код реализован, прошёл ревью, PR привязан (Fixes #номер)
        - label: Все критерии приёмки выполнены и проверены
        - label: Автотесты добавлены на запланированных уровнях и привязаны к идентификатору требования
        - label: Все обязательные проверки CI зелёные (lint, тесты, контракт, UI, Docker, Kubernetes smoke)
        - label: Если менялся API, снимок OpenAPI обновлён осознанно, обратная совместимость проверена
        - label: Тексты интерфейса переведены (ru и en), состояния загрузки, пусто и ошибки проверены
        - label: Нет секретов и персональных данных в коде, логах и тестовых данных; ошибки и граничные случаи обработаны
        - label: Логи и метрики добавлены там, где нужно; дашборд или алерт обновлены при необходимости
        - label: Документация обновлена (README, требования, примеры)
        - label: Проверено на развёрнутом стенде (кластер), регрессии не найдены
        - label: Найденные в ходе работы дефекты заведены как баги (bug) с серьёзностью и приоритетом
