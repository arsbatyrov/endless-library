name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

# Новый запуск для той же ветки отменяет предыдущий, ещё не закончившийся.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Минимально необходимые права токена: только чтение кода.
permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Версия ruff закреплена в requirements-dev.txt: та же, что у разработчика локально.
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci ставит ровно те версии, что записаны в package-lock.json.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

  tests:
    name: Tests (Python 3.12, PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # PostgreSQL запускается как соседний контейнер на время этого job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: library
          POSTGRES_PASSWORD: library
          POSTGRES_DB: library
        ports:
          - 5432:5432
        # Шаги ниже начнутся только когда база ответит на pg_isready.
        options: >-
          --health-cmd "pg_isready -U library -d library"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Тесты сами создадут отдельную базу library_test и применят миграции.
      DATABASE_URL: postgresql+psycopg://library:library@127.0.0.1:5432/library

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Нужны и dev-зависимости: при сборе тестов импортируется playwright (UI-тесты отключены маркером).
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        # Сборка падает, если покрытие ниже 95% (сейчас 98%).
        run: pytest --cov-report=xml --cov-fail-under=95

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  ui-tests:
    name: UI tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: library
          POSTGRES_PASSWORD: library
          POSTGRES_DB: library
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U library -d library"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # UI-тесты сами создадут базу library_e2e_test, применят миграции и поднимут API и фронтенд.
      DATABASE_URL: postgresql+psycopg://library:library@127.0.0.1:5432/library

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # --with-deps ставит и системные библиотеки, нужные браузеру на чистой машине Linux.
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run UI tests
        run: pytest -m ui --no-cov

      # При падении сохраняем скриншоты, видео, трассировки и логи серверов (папка test-results).
      # Скачать: gh run download <id> -n ui-test-results; открыть трассировку: python -m playwright show-trace trace.zip
      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: Docker images (build and smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # docker-compose.yml берёт имя, пароль и базу из .env; для проверки хватает шаблона.
      - name: Create .env from the template
        run: cp .env.example .env

      - name: Build images and start the stack
        run: docker compose --profile full up -d --build

      # Ждём, пока фронтенд (nginx) начнёт отвечать, и проверяем весь путь: браузер -> nginx -> API -> база.
      - name: Smoke test through nginx
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/api/health && break
            sleep 2
          done
          echo
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8080/ | grep -q 'id="root"'
          test "$(curl -fsS http://127.0.0.1:8080/api/books)" = "[]"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/books/999)" = "404"
          docker compose --profile full exec -T api id -u | grep -qx 10001

      - name: Show container logs on failure
        if: failure()
        run: docker compose --profile full logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose --profile full down -v
