name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

# Новый запуск для той же ветки отменяет предыдущий, ещё не закончившийся.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Минимально необходимые права токена: только чтение кода.
permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Версия ruff закреплена в requirements-dev.txt: та же, что у разработчика локально.
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci ставит ровно те версии, что записаны в package-lock.json.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

  tests:
    name: Tests (Python 3.12, PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # PostgreSQL запускается как соседний контейнер на время этого job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: library
          POSTGRES_PASSWORD: library
          POSTGRES_DB: library
        ports:
          - 5432:5432
        # Шаги ниже начнутся только когда база ответит на pg_isready.
        options: >-
          --health-cmd "pg_isready -U library -d library"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Тесты сами создадут отдельную базу library_test и применят миграции.
      DATABASE_URL: postgresql+psycopg://library:library@127.0.0.1:5432/library

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        # Сборка падает, если покрытие ниже 95% (сейчас 98%).
        run: pytest --cov-report=xml --cov-fail-under=95

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
