name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

# Новый запуск для той же ветки отменяет предыдущий, ещё не закончившийся.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Минимально необходимые права токена: только чтение кода.
permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Версия ruff закреплена в requirements-dev.txt: та же, что у разработчика локально.
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci ставит ровно те версии, что записаны в package-lock.json.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

  tests:
    name: Tests (Python 3.12, PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # PostgreSQL запускается как соседний контейнер на время этого job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: library
          POSTGRES_PASSWORD: library
          POSTGRES_DB: library
        ports:
          - 5432:5432
        # Шаги ниже начнутся только когда база ответит на pg_isready.
        options: >-
          --health-cmd "pg_isready -U library -d library"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Redis для тестов кэша (они используют базу №15 и очищают её).
      redis:
        image: redis:8.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Тесты сами создадут отдельную базу library_test и применят миграции.
      DATABASE_URL: postgresql+psycopg://library:library@127.0.0.1:5432/library

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Нужны и dev-зависимости: при сборе тестов импортируется playwright (UI-тесты отключены маркером).
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        # Сборка падает, если покрытие ниже 95% (сейчас 98%).
        run: pytest --cov-report=xml --cov-fail-under=95

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  contract:
    name: Contract tests (Schemathesis)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: library
          POSTGRES_PASSWORD: library
          POSTGRES_DB: library
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U library -d library"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://library:library@127.0.0.1:5432/library

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Schemathesis читает OpenAPI-схему API и сам генерирует запросы; второй тест сравнивает схему со снимком.
      - name: Run contract tests
        run: pytest tests/contract -m contract --no-cov

  ui-tests:
    name: UI tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: library
          POSTGRES_PASSWORD: library
          POSTGRES_DB: library
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U library -d library"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # UI-тесты сами создадут базу library_e2e_test, применят миграции и поднимут API и фронтенд.
      DATABASE_URL: postgresql+psycopg://library:library@127.0.0.1:5432/library

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # --with-deps ставит и системные библиотеки, нужные браузеру на чистой машине Linux.
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run UI tests
        run: pytest -m ui --no-cov

      # При падении сохраняем скриншоты, видео, трассировки и логи серверов (папка test-results).
      # Скачать: gh run download <id> -n ui-test-results; открыть трассировку: python -m playwright show-trace trace.zip
      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  kubernetes:
    name: Kubernetes (kind cluster smoke tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # Тесты не ходят в базу напрямую (база живёт в кластере), но общий conftest требует переменную.
      DATABASE_URL: postgresql+psycopg://library:library@127.0.0.1:5432/library
      KIND_VERSION: v0.33.0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # kind закреплён по версии и проверяется по контрольной сумме: скачанный файл не подменить незаметно.
      # kubectl и Docker уже есть на раннере.
      - name: Install kind
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSLo kind.sha256sum "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64.sha256sum"
          echo "$(cut -d' ' -f1 kind.sha256sum)  kind" | sha256sum -c -
          sudo install -m 0755 kind /usr/local/bin/kind
          kind version

      - name: Create the cluster
        run: kind create cluster --config k8s/kind-config.yaml --wait 120s

      # Собирает образы из кода этого коммита, загружает их в кластер и разворачивает всё: база, миграции, API, web, Ingress.
      - name: Deploy the application
        run: bash k8s/deploy.sh

      # AUTH-012: remember the secrets (a hash of their content, never the content itself in the log)
      - name: Record the secrets
        run: |
          for s in endless-library-admin endless-library-jwt endless-library-db; do
            echo "$s $(kubectl --context kind-endless-library -n endless-library get secret $s -o jsonpath='{.data}' | sha256sum)"
          done | tee secrets-before.txt

      - name: Run smoke and resilience tests
        run: pytest tests/smoke -m smoke --no-cov

      # AUTH-012: deploying again must not touch the admin or any secret, and must not show a password again.
      - name: Deploy again (nothing may change)
        run: |
          SKIP_BUILD=1 bash k8s/deploy.sh | tee deploy-second.log
          grep -q "left unchanged" deploy-second.log
          # (`! grep` would not stop the step under `set -e`, so the check is written as an `if`)
          if grep -q "Первый администратор" deploy-second.log; then
            echo "the second deploy showed an admin password again" >&2
            exit 1
          fi
          for s in endless-library-admin endless-library-jwt endless-library-db; do
            echo "$s $(kubectl --context kind-endless-library -n endless-library get secret $s -o jsonpath='{.data}' | sha256sum)"
          done > secrets-after.txt
          diff secrets-before.txt secrets-after.txt

      - name: The admin still signs in after the second deploy
        run: pytest tests/smoke/test_first_admin.py -m smoke --no-cov

      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl --context kind-endless-library get pods -A -o wide
          kubectl --context kind-endless-library -n endless-library describe pods
          kubectl --context kind-endless-library -n endless-library logs --all-containers --prefix --tail=100 -l app=api
          kubectl --context kind-endless-library -n endless-library logs --all-containers --prefix --tail=100 -l app=db
          kubectl --context kind-endless-library -n traefik logs --tail=100 deployment/traefik

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kubernetes-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: Docker images (build and smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # docker-compose.yml берёт имя, пароль и базу из .env; для проверки хватает шаблона.
      - name: Create .env from the template
        run: |
          cp .env.example .env
          # the API refuses to start without a strong JWT secret: generate one for this run
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" .env

      - name: Build images and start the stack
        run: docker compose --profile full up -d --build

      # Ждём, пока фронтенд (nginx) начнёт отвечать, и проверяем весь путь: браузер -> nginx -> API -> база.
      - name: Smoke test through nginx
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8081/api/health && break
            sleep 2
          done
          echo
          curl -fsS http://127.0.0.1:8081/api/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8081/ | grep -q 'id="root"'
          # without a login the data is closed
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/api/books)" = "401"
          # the first admin is created the way production does it: the password travels in the environment,
          # never as an argument of the command
          admin_password="$(openssl rand -hex 16)"
          echo "::add-mask::$admin_password"
          docker compose --profile full exec -T -e LIBRARY_USER_PASSWORD="$admin_password" api \
            python -m app.cli create-user --username ci-admin --role admin
          token="$(curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"username\":\"ci-admin\",\"password\":\"$admin_password\"}" \
            http://127.0.0.1:8081/api/auth/login | jq -r .access_token)"
          test "$(curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:8081/api/books)" = "[]"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" http://127.0.0.1:8081/api/books/999)" = "404"
          docker compose --profile full exec -T api id -u | grep -qx 10001

      - name: Show container logs on failure
        if: failure()
        run: docker compose --profile full logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose --profile full down -v
