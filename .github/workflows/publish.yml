name: Publish images

# Образы собираются и публикуются в реестр GitHub (GHCR) при слиянии в main и при теге версии vX.Y.Z.
# Ничего не публикуется из pull request: код в main уже прошёл все обязательные проверки.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# По умолчанию токену разрешено только чтение; запись пакетов выдаётся ниже, только этому job.
permissions:
  contents: read

# Публикации одной ветки идут по очереди и не отменяют друг друга.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # отправка образов в ghcr.io

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: library-api
            context: .
          - image: library-web
            context: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Вход встроенным токеном GITHUB_TOKEN: отдельные пароли и секреты не нужны.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Имена и теги образов: sha-<коммит> всегда, latest для main, версия для тега vX.Y.Z.
      - name: Compute image names, tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Library demo: ${{ matrix.image }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Кэш слоёв между запусками: сборка без изменений зависимостей занимает секунды.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
